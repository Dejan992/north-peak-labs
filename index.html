    <script>
      (function () {
        var header = document.querySelector(".site-header");
        var themeButton = document.querySelector(".theme-toggle");
        var root = document.documentElement;

        function onScroll() {
          if (header) header.classList.toggle("is-scrolled", window.scrollY > 4);
        }
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });

        function appliedTheme() {
          var explicit = root.getAttribute("data-theme");
          if (explicit === "light" || explicit === "dark") return explicit;
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        function syncThemeControls() {
          if (!themeButton) return;
          var next = appliedTheme() === "dark" ? "light" : "dark";
          themeButton.setAttribute("aria-label", "Switch to " + next + " theme");
        }
        function setThemeColor(theme) {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (node) { node.remove(); });
          var meta = document.createElement("meta");
          meta.setAttribute("name", "theme-color");
          meta.setAttribute("content", theme === "dark" ? "#101614" : "#f4f1ea");
          document.head.appendChild(meta);
        }
        syncThemeControls();
        if (root.getAttribute("data-theme")) setThemeColor(appliedTheme());
        if (themeButton) {
          themeButton.addEventListener("click", function () {
            var next = appliedTheme() === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try { localStorage.setItem("npl-theme", next); } catch (e) {}
            setThemeColor(next);
            syncThemeControls();
          });
        }
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
          if (!root.getAttribute("data-theme")) syncThemeControls();
        });
      })();
    </script>
    <script>
      (function () {
        var root = document.querySelector(".learn");
        if (!root) return;
        var runs = Array.prototype.map.call(root.querySelectorAll(".run"), function (el) {
          var path = el.querySelector(".run-path");
          var len = path.getTotalLength();
          var tips = [];
          Array.prototype.forEach.call(el.querySelectorAll(".run-miss"), function (miss) {
            var idx = Number(miss.getAttribute("data-tip"));
            var pts = path.points;
            var at = 0;
            for (var i = 1; i <= idx && i < pts.numberOfItems; i++) {
              var a = pts.getItem(i - 1);
              var b = pts.getItem(i);
              at += Math.hypot(b.x - a.x, b.y - a.y);
            }
            tips.push({ el: miss, at: len ? at / len : 1 });
          });
          return {
            el: el,
            path: path,
            len: len,
            tips: tips,
            blocks: el.querySelectorAll(".block"),
            packet: el.querySelector(".run-packet")
          };
        });
        var layers = root.querySelectorAll(".layer");
        var reduceQ = window.matchMedia("(prefers-reduced-motion: reduce)");
        var phases = [];
        var total = 0;
        function phase(type, run, dur) {
          phases.push({ type: type, run: run, at: total, dur: dur });
          total += dur;
        }
        phase("run", 0, 3000);
        phase("out", 0, 420);
        phase("learn", 0, 880);
        phase("run", 1, 2100);
        phase("out", 1, 480);
        phase("learn", 1, 880);
        phase("run", 2, 1400);
        phase("out", 2, 560);
        phase("learn", 2, 880);
        phase("hold", 0, 2400);

        function phaseOf(type, run) {
          for (var i = 0; i < phases.length; i++) {
            if (phases[i].type === type && phases[i].run === run) return phases[i];
          }
          return null;
        }
        function ease(u) {
          return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        }
        function progress(type, run, t) {
          var item = phaseOf(type, run);
          if (!item) return 0;
          if (t >= item.at + item.dur) return 1;
          if (t < item.at) return 0;
          return (t - item.at) / item.dur;
        }
        function render(now) {
          var t = now % total;
          var feeding = false;
          runs.forEach(function (run, r) {
            var lin = progress("run", r, t);
            var rp = lin <= 0 || lin >= 1 ? lin : ease(lin);
            var op = progress("out", r, t);
            var lp = progress("learn", r, t);
            run.path.style.strokeDasharray = run.len;
            run.path.style.strokeDashoffset = String(run.len * (1 - rp));
            run.tips.forEach(function (tip) {
              tip.el.style.opacity = rp + 0.02 >= tip.at ? "1" : "0";
            });
            var n = run.blocks.length;
            var shown = Math.max(0, Math.ceil(op * n - 0.001));
            for (var b = 0; b < n; b++) run.blocks[b].style.opacity = b < shown ? "1" : "0";
            if (rp > 0 && rp < 1) {
              var pt = run.path.getPointAtLength(Math.max(0, Math.min(run.len, run.len * rp)));
              run.packet.setAttribute("transform", "translate(" + pt.x.toFixed(2) + " " + pt.y.toFixed(2) + ")");
              run.packet.style.opacity = "1";
            } else {
              run.packet.style.opacity = "0";
            }
            run.el.classList.toggle("is-live", rp > 0 && rp < 1);
            run.el.classList.toggle("is-source", lp > 0 && lp < 1);
            if (lp > 0 && lp < 1) feeding = true;
          });
          layers.forEach(function (layer, li) {
            var marks = layer.querySelectorAll(".marks i");
            var hot = false;
            for (var r = 0; r < marks.length; r++) {
              var lp = progress("learn", r, t);
              var start = li / 4;
              var end = (li + 1) / 4;
              marks[r].classList.toggle("is-on", lp + 0.001 >= end);
              if (lp > start && lp < end) hot = true;
            }
            layer.classList.toggle("is-hot", hot);
          });
          root.classList.toggle("is-feeding", feeding);
        }

        var running = false;
        var raf = 0;
        var elapsed = 0;
        var origin = 0;
        var onScreen = false;

        function frame(now) {
          if (!running) return;
          if (!origin) origin = now - elapsed;
          elapsed = now - origin;
          render(elapsed);
          raf = requestAnimationFrame(frame);
        }
        function stop() {
          running = false;
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          origin = 0;
        }
        function play() {
          if (running || reduceQ.matches || document.hidden || !onScreen) return;
          running = true;
          root.classList.add("is-playing");
          root.classList.remove("is-static");
          render(elapsed);
          raf = requestAnimationFrame(frame);
        }
        function settle() {
          stop();
          root.classList.remove("is-playing");
          root.classList.remove("is-feeding");
          root.classList.add("is-static");
          runs.forEach(function (run) {
            run.path.style.strokeDasharray = "";
            run.path.style.strokeDashoffset = "";
            run.packet.style.opacity = "0";
            run.tips.forEach(function (tip) { tip.el.style.opacity = ""; });
            Array.prototype.forEach.call(run.blocks, function (block) { block.style.opacity = ""; });
            run.el.classList.remove("is-live");
            run.el.classList.remove("is-source");
          });
          layers.forEach(function (layer) {
            layer.classList.remove("is-hot");
            Array.prototype.forEach.call(layer.querySelectorAll(".marks i"), function (mark) {
              mark.classList.add("is-on");
            });
          });
        }

        document.addEventListener("visibilitychange", function () {
          if (document.hidden) stop();
          else play();
        });
        reduceQ.addEventListener("change", function () {
          if (reduceQ.matches) settle();
          else play();
        });
        if ("IntersectionObserver" in window) {
          var io = new IntersectionObserver(function (entries) {
            onScreen = entries[0].isIntersecting;
            if (onScreen) play();
            else stop();
          }, { threshold: 0.2 });
          io.observe(root);
        } else {
          onScreen = true;
        }
        if (reduceQ.matches) settle();
        else play();
      })();
    </script>
