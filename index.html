    <script>
      (function () {
        var header = document.querySelector(".site-header");
        var themeButton = document.querySelector(".theme-toggle");
        var root = document.documentElement;

        function onScroll() {
          if (header) header.classList.toggle("is-scrolled", window.scrollY > 4);
        }
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });

        function appliedTheme() {
          var explicit = root.getAttribute("data-theme");
          if (explicit === "light" || explicit === "dark") return explicit;
          return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        function syncThemeControls() {
          if (!themeButton) return;
          var next = appliedTheme() === "dark" ? "light" : "dark";
          themeButton.setAttribute("aria-label", "Switch to " + next + " theme");
        }
        function setThemeColor(theme) {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (node) { node.remove(); });
          var meta = document.createElement("meta");
          meta.setAttribute("name", "theme-color");
          meta.setAttribute("content", theme === "dark" ? "#101614" : "#f4f1ea");
          document.head.appendChild(meta);
        }
        syncThemeControls();
        if (root.getAttribute("data-theme")) setThemeColor(appliedTheme());
        if (themeButton) {
          themeButton.addEventListener("click", function () {
            var next = appliedTheme() === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try { localStorage.setItem("npl-theme", next); } catch (e) {}
            setThemeColor(next);
            syncThemeControls();
          });
        }
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
          if (!root.getAttribute("data-theme")) syncThemeControls();
        });
      })();
    </script>
    <script>
      (function () {
        var root = document.querySelector(".flow");
        if (!root) return;
        var svg = root.querySelector(".flow-svg");
        var bead = svg.querySelector(".flow-bead");
        var ghosts = svg.querySelectorAll(".flow-ghost");
        var paths = {
          a: svg.querySelector(".p-a"),
          loop: svg.querySelector(".flow-loop"),
          b: svg.querySelector(".p-b"),
          fast: svg.querySelector(".p-fast")
        };
        var edges = svg.querySelectorAll(".flow-edges line.is-key");
        var nodes = svg.querySelectorAll(".flow-node[data-learn]");
        var trends = root.querySelectorAll(".trend-line");
        var ship = svg.querySelector(".flow-ship");
        var reduceQ = window.matchMedia("(prefers-reduced-motion: reduce)");
        var phases = [];
        var total = 0;
        function add(name, dur) {
          phases.push({ name: name, at: total, dur: dur });
          total += dur;
        }
        add("a", 800);
        add("loop", 1200);
        add("b", 900);
        add("gate", 420);
        add("fast1", 900);
        add("grow", 520);
        add("fast2", 720);
        add("ship", 240);
        add("trends", 860);
        add("hold", 1800);

        function local(name, t) {
          for (var i = 0; i < phases.length; i++) {
            var phase = phases[i];
            if (phase.name !== name) continue;
            if (t >= phase.at + phase.dur) return 1;
            if (t < phase.at) return 0;
            return (t - phase.at) / phase.dur;
          }
          return 0;
        }
        function live(name, t) {
          for (var i = 0; i < phases.length; i++) {
            var phase = phases[i];
            if (phase.name === name && t >= phase.at && t < phase.at + phase.dur) return (t - phase.at) / phase.dur;
          }
          return -1;
        }
        function ease(u) {
          return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        }
        function len(el) {
          if (!el._len) el._len = el.getTotalLength();
          return el._len;
        }
        function point(el, t) {
          var n = len(el);
          var pt = el.getPointAtLength(Math.max(0, Math.min(n, n * t)));
          return [pt.x, pt.y];
        }
        function dash(el, t) {
          var n = len(el);
          el.style.strokeDasharray = n;
          el.style.strokeDashoffset = String(n * (1 - t));
        }
        var trail = [];
        function place(x, y, question) {
          bead.setAttribute("cx", x.toFixed(2));
          bead.setAttribute("cy", y.toFixed(2));
          bead.classList.toggle("is-question", !!question);
          bead.style.opacity = "1";
          trail.push([x, y]);
          if (trail.length > 10) trail.shift();
          var g1 = trail[Math.max(0, trail.length - 4)];
          var g2 = trail[Math.max(0, trail.length - 8)];
          ghosts[0].setAttribute("cx", g1[0].toFixed(2));
          ghosts[0].setAttribute("cy", g1[1].toFixed(2));
          ghosts[1].setAttribute("cx", g2[0].toFixed(2));
          ghosts[1].setAttribute("cy", g2[1].toFixed(2));
          ghosts[0].style.opacity = trail.length > 4 ? "0.4" : "0";
          ghosts[1].style.opacity = trail.length > 8 ? "0.2" : "0";
        }
        function hideBead() {
          bead.style.opacity = "0";
          ghosts[0].style.opacity = "0";
          ghosts[1].style.opacity = "0";
          trail = [];
        }
        function render(now) {
          var t = now % total;
          var level = 0;
          if (local("fast2", t) > 0.2) level = 2;
          else if (local("fast1", t) > 0.35) level = 1;
          edges.forEach(function (edge) {
            var step = Number(edge.getAttribute("data-step"));
            edge.classList.toggle("is-lit", level >= step);
            edge.classList.toggle("is-strong", level >= 2 && step === 1);
          });
          nodes.forEach(function (node) {
            node.classList.toggle("is-lit", level >= Number(node.getAttribute("data-learn")));
          });
          var trendT = local("trends", t);
          trends.forEach(function (line) {
            dash(line, trendT);
            var head = line.parentNode.querySelector(".trend-head");
            if (head) head.classList.toggle("is-on", trendT > 0.82);
          });
          ship.classList.toggle("is-on", local("ship", t) > 0);
          root.classList.toggle("is-checking", live("gate", t) >= 0);
          var moving = null;
          var question = false;
          var u = live("a", t);
          if (u >= 0) moving = point(paths.a, ease(u));
          u = live("loop", t);
          if (u >= 0) { moving = point(paths.loop, ease(u)); question = true; }
          u = live("b", t);
          if (u >= 0) moving = point(paths.b, ease(u));
          u = live("gate", t);
          if (u >= 0) moving = point(paths.b, 1);
          u = live("fast1", t);
          if (u >= 0) moving = point(paths.fast, ease(u) * 0.48);
          u = live("grow", t);
          if (u >= 0) moving = point(paths.fast, 0.48);
          u = live("fast2", t);
          if (u >= 0) moving = point(paths.fast, 0.48 + ease(u) * 0.52);
          if (moving) place(moving[0], moving[1], question);
          else hideBead();
        }

        var running = false;
        var raf = 0;
        var elapsed = 0;
        var origin = 0;
        var onScreen = false;
        function frame(ts) {
          if (!running) return;
          if (!origin) origin = ts - elapsed;
          elapsed = ts - origin;
          render(elapsed);
          raf = requestAnimationFrame(frame);
        }
        function stop() {
          running = false;
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          origin = 0;
        }
        function play() {
          if (running || reduceQ.matches || document.hidden || !onScreen) return;
          running = true;
          root.classList.add("is-playing");
          root.classList.remove("is-static");
          render(elapsed);
          raf = requestAnimationFrame(frame);
        }
        function settle() {
          stop();
          root.classList.remove("is-playing");
          root.classList.remove("is-checking");
          root.classList.add("is-static");
          edges.forEach(function (edge) {
            edge.classList.add("is-lit");
            edge.classList.toggle("is-strong", edge.getAttribute("data-step") === "1");
          });
          nodes.forEach(function (node) { node.classList.add("is-lit"); });
          ship.classList.add("is-on");
          trends.forEach(function (line) {
            line.style.strokeDasharray = "";
            line.style.strokeDashoffset = "";
          });
          hideBead();
        }
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) stop();
          else play();
        });
        reduceQ.addEventListener("change", function () {
          if (reduceQ.matches) settle();
          else play();
        });
        if ("IntersectionObserver" in window) {
          var watch = new IntersectionObserver(function (entries) {
            onScreen = entries[0].isIntersecting;
            if (onScreen) play();
            else stop();
          }, { threshold: 0.18 });
          watch.observe(root);
        } else {
          onScreen = true;
        }
        if (reduceQ.matches) settle();
        else play();
      })();
    </script>
