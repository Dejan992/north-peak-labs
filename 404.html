<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | North Peak Labs</title>
    <meta name="description" content="This page is not on the North Peak Labs site." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <style>
      :root { color-scheme: light; --bg: #f4f1ea; --ink: #13201c; --muted: #3e5149; --pine: #0d4a42; --button: #f7f4ee; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; --bg: #101614; --ink: #f3f0e8; --muted: #b7c4bd; --pine: #9ed9cb; --button: #10201c; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }
      main { width: min(36rem, 100%); }
      img { width: 48px; height: 40px; }
      h1 { font-family: Georgia, "Iowan Old Style", serif; font-weight: 500; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.03em; line-height: 1.05; margin: 0.8rem 0; }
      p { margin: 0 0 1.25rem; color: var(--muted); font-size: 1.05rem; }
      a { display: inline-flex; align-items: center; min-height: 48px; padding: 0.7rem 1rem; background: var(--pine); color: var(--button); text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/mark.png" width="48" height="40" alt="" />
      <h1>This page is not on the site.</h1>
      <p>North Peak Labs is a consulting practice. The work lives on the home page.</p>
      <a href="/">Back to North Peak Labs</a>
    </main>
  </body>
</html>
